[project]
name = "clip"
version = "0.1.0"
description = "CLIP paper implementation"
readme = "README.md"
authors = [
    { name = "mahmoud etman", email = "metman835@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.2",
    "pandas>=3.0.6",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

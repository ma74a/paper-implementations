
[project]
name = "clip"
version = "0.1.0"
requires-python = ">=3.10,<3.11"
dependencies = [
    "hydra-core>=1.3.7",
    "matplotlib>=3.10.9",
    "numpy>=2.2.6",
    "omegaconf>=2.3.1",
    "pandas>=2.3.3",
    "torch>=2.14.1",
    "torchinfo>=1.8.0",
    "torchvision>=0.29.1",
    "tqdm>=4.70.1",
    "transformers>=5.20.1",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }


defaults:
  - _self_

model:
  in_channels: 3
  num_classes: 6
  img_size: 224
  patch_size: 16
  num_of_encoders: 6
  embed_dim: 256
  dff_scale_factor: 4
  num_heads: 8

  # dropout
  input_dropout_rate: 0.1
  attention_dropout_rate: 0.1
  ff_dropout_rate: 0.1

train:
  batch_size: 32
  epochs: 100
  # train_dataset_path : 'dataset_path/tom_and_jerry/train'
  # val_dataset_path : 'dataset_path/tom_and_jerry/val'
  train_dataset_path : '/home/etman/Downloads/ViT_data/train'
  val_dataset_path : '/home/etman/Downloads/ViT_data/val'

optimizer:
  lr: 3e-4
  weight_decay : 0.1
  beta1 : 0.9
  beta2 : 0.999
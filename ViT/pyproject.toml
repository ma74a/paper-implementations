[project]
name = "vit"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "mahmoud etman", email = "metman835@gmail.com" }
]
requires-python = ">=3.10,<3.11"
dependencies = [
    "hydra-core>=1.3.7",
    "matplotlib>=3.10.9",
    "numpy>=2.2.6",
    "omegaconf>=2.3.1",
    "pillow>=12.3.0",
    "torch>=2.14.0",
    "torchinfo>=1.8.0",
    "torchvision>=0.29.0",
]

[project.scripts]
vit = "vit:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"

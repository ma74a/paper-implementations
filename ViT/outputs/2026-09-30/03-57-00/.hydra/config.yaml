model:
  in_channels: 3
  num_classes: 4
  img_size: 224
  patch_size: 16
  num_of_encoders: 6
  embed_dim: 256
  dff_scale_factor: 4
  num_heads: 8
  input_dropout_rate: 0.1
  attention_dropout_rate: 0.1
